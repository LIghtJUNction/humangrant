name: temporary-rustfmt-export
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust sources
        run: cargo fmt
      - name: Upload formatted source
        uses: actions/upload-artifact@v4
        with:
          name: formatted-rust-source
          path: |
            src/**/*.rs
            src/*.rs
            tests/*.rs
          if-no-files-found: error
          retention-days: 1
