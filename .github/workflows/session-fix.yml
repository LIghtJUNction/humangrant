name: existing-login-validation
on:
  push:
    branches: [fix/existing-human-login]
    paths:
      - .github/session-fix.py
      - .github/workflows/session-fix.yml
      - tests/cases/existing_login.rs
      - tests/test_existing_login_ui.py
      - tests/test_existing_login_migration.py
permissions:
  contents: write
concurrency:
  group: existing-login-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed source update
        run: python .github/session-fix.py
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Format and check Rust
        run: |
          cargo fmt
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
      - name: Rust authorization regression tests
        run: cargo test
      - name: Python, SQLite and UI tests
        run: python -m pytest -q
      - name: Protocol, skills and prompt checks
        run: |
          python scripts/check.py
          python scripts/sync_prompt.py --check
          node --check examples/web/ui.js
          node --check examples/web/webcrypto.js
      - name: Real HTTP flow, local mail only
        run: |
          cargo build
          python scripts/e2e.py --binary target/debug/humangrant
      - name: Commit tested changes on the feature branch
        run: |
          rm .github/session-fix.py .github/workflows/session-fix.yml
          git add -u
          git add migrations/0002_existing_login.sql
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'fix: reuse verified human login for per-request consent'
          git push origin HEAD:fix/existing-human-login
